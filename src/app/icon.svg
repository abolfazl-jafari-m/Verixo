<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="100%" height="100%">
  <defs>
    <!-- گرادیان بازوی چپ (تیره‌تر و عمیق‌تر) -->
    <linearGradient id="leftArmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    
    <!-- گرادیان بازوی راست (روشن‌تر و پرانرژی) -->
    <linearGradient id="rightArmGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    
    <!-- سایه ملایم برای ایجاد افکت هم‌پوشانی و عمق (3D fold) -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="-2" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- بازوی چپ (پشت) -->
  <path 
    d="M 35 25 
       C 25 25, 18 35, 22 45 
       L 72 150 
       C 76 158, 86 162, 94 156 
       L 110 144 
       C 100 130, 75 80, 55 40 
       C 50 30, 43 25, 35 25 Z" 
    fill="url(#leftArmGrad)" 
  />

  <!-- بازوی راست (روی بازوی چپ قرار می‌گیرد و سایه دارد) -->
  <path 
    d="M 80 155 
       C 86 162, 98 162, 104 154
       L 178 45 
       C 182 35, 175 25, 165 25
       C 155 25, 148 30, 144 40
       L 92 135
       Z" 
    fill="url(#rightArmGrad)"
    filter="url(#dropShadow)"
  />
</svg>
